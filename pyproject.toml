[project]
name = "creature"
version = "0.0.1"
description = "An agent that grows its own capabilities while its authority stays fixed."
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema>=4",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-m", "not slow", "--strict-markers", "-ra"]
xfail_strict = true
markers = [
    "slow: live network or model call; run with `uv run pytest -m slow`",
    "docker: needs the Docker daemon; skipped (and listed) when it is not reachable",
]
