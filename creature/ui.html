<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creature</title><link rel="icon" href="data:,">
<style>
@font-face{font-family:"Barlow UI";src:local("Barlow"),url(/font/barlow-regular.ttf);font-weight:400}
@font-face{font-family:"Barlow UI";src:local("Barlow SemiBold"),url(/font/barlow-semibold.ttf);font-weight:600}
@font-face{font-family:"Barlow UI";src:local("Barlow ExtraBold"),url(/font/barlow-extrabold.ttf);font-weight:800}
@font-face{font-family:"Mono UI";src:local("JetBrains Mono"),url(/font/jetbrainsmono.ttf);font-weight:100 800}
:root{--bg:#05070D;--panel:rgba(11,16,34,.55);--glass:rgba(11,16,34,.92);--navy:#141B33;--text:#F5F6F8;
  --mute:rgba(245,246,248,.45);--line:rgba(245,246,248,.09);--acc:#FFC926;--core:#FFF4C7;--ink:#05070D;
  --ok:var(--text);--bad:#FF6B5B;--r:14px;
  --sans:"Barlow UI","Barlow",system-ui,sans-serif;--mono:"Mono UI","JetBrains Mono",ui-monospace,Menlo,monospace}
#space{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header{z-index:2}main{position:relative;z-index:1}
::selection{background:rgba(255,201,38,.25)}textarea{caret-color:var(--acc)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:400 20px/1.4 var(--sans);min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit}
.cap{font:500 14px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--mute)}
.cap i{font-style:normal;color:var(--acc);margin-right:10px}
.sub{font:500 15px/1.4 var(--mono);color:var(--mute)}

header{display:flex;align-items:center;gap:24px;padding:16px 32px;border-bottom:1px solid var(--line);position:relative}
h1{font:800 30px/1 var(--sans);letter-spacing:.03em;margin:0;text-transform:uppercase}h1 span{color:var(--acc)}
.dd{position:relative;min-width:0}
.dd>button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;width:100%;min-height:46px;padding:8px 14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font:600 18px var(--mono);color:var(--text);border-radius:var(--r)}
.dd>button:hover,.dd.open>button{border-color:var(--acc)}
.dd .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd .m{margin-left:auto;flex:none;color:var(--mute);font:500 14px var(--mono)}
.dd .chev{flex:none;width:9px;height:9px;border-right:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:translateY(-3px) rotate(45deg);transition:transform .15s}
.dd.open .chev{transform:translateY(2px) rotate(-135deg)}
.dd ul{display:none;position:absolute;left:0;min-width:100%;top:calc(100% + 4px);z-index:20;margin:0;padding:6px 0;list-style:none;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);max-height:min(60vh,520px);overflow:auto}
.dd.up ul{top:auto;bottom:calc(100% + 4px)}
.dd.open ul{display:block}
.dd li{display:flex;gap:18px;align-items:baseline;padding:10px 14px;cursor:pointer;font:500 17px var(--mono);white-space:nowrap}
.dd li:hover,.dd li.kb{background:rgba(255,201,38,.10)}
.dd li.on{color:var(--acc)}.dd li.on .v::before{content:"● ";font-size:11px;vertical-align:2px}
.dd li.g{cursor:default;background:none;font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--mute);padding:12px 14px 4px}
.dd li.bad{opacity:.45}
#home{width:min(420px,60vw)}#design{width:100%;min-width:0}
#skillsbtn{all:unset;cursor:pointer;font:500 16px var(--mono);color:var(--mute)}#skillsbtn:hover,#skillsbtn.on{color:var(--acc)}
#skills{display:none;position:absolute;left:32px;top:calc(100% + 6px);z-index:5;width:min(860px,calc(100vw - 64px));max-height:70vh;overflow:auto;
  background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:6px 0}
#skills.open{display:block}
#skills .sk{all:unset;box-sizing:border-box;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 16px;align-items:center;width:100%;padding:10px 18px;cursor:pointer;border-bottom:1px solid var(--line)}
#skills .sk:last-child{border-bottom:0}#skills .sk:hover{background:rgba(255,201,38,.08)}
#skills .n{font:600 18px var(--sans)}#skills .e{grid-column:2/4;font:400 15px/1.35 var(--sans);color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#skills .m{font:500 13px var(--mono);color:var(--mute);white-space:nowrap}
#skills .none{padding:14px 18px;color:var(--mute)}
.sw{display:flex;gap:2px;flex:none}.sw i{width:12px;height:12px;border-radius:3px;outline:1px solid var(--line)}

main{flex:1;display:grid;grid-template-columns:minmax(340px,1fr) auto auto}
.col{padding:24px 32px;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--line);min-width:0}
.col:last-child{border-right:0}
.head{min-height:58px}.head b{display:block;font:700 20px/1.3 var(--sans);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:calc(min(64vh,720px)*9/16)}

.script{flex:none;display:flex;flex-direction:column}
textarea{flex:none;field-sizing:content;min-height:2.9em;max-height:42vh;width:100%;background:transparent;border:0;color:var(--text);resize:none;outline:none;padding:0;
  font:600 34px/1.45 var(--sans)}
#picks{display:none;flex:none;max-height:42vh;overflow:auto}#picks.on{display:block}
#picks div{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid var(--line)}
#picks .t{font:600 26px/1.25 var(--sans)}
#picks .chip{all:unset;flex:none;cursor:pointer;font:500 14px var(--mono);color:var(--acc);white-space:nowrap}
#picks .chip:hover,#picks .chip.on{text-decoration:underline}#picks .chip.none{color:var(--mute);cursor:default}
#edit{all:unset;cursor:pointer;font:500 14px var(--mono);color:var(--mute);margin-top:10px}#edit:hover{color:var(--acc)}#edit[hidden]{display:none}

#how{flex:1;min-height:280px;display:flex;flex-direction:column;justify-content:center;gap:14px;padding-top:16px;border-top:1px solid var(--line)}
#flow{flex:none;width:100%;height:auto}
#say{font:600 19px/1.35 var(--sans);min-height:52px}#say b{font:500 14px var(--mono);color:var(--acc);letter-spacing:.1em;margin-right:12px}
.nd rect{fill:rgba(11,16,34,.75);stroke:rgba(245,246,248,.14);transition:stroke .35s,fill .35s}
.nd .a{font:700 18px "Barlow UI","Barlow",system-ui,sans-serif;fill:var(--text);transition:fill .35s}.nd .b{font:500 13.5px "Barlow UI","Barlow",sans-serif;fill:rgba(245,246,248,.75)}.nd .c{font:500 10px "Mono UI","JetBrains Mono",monospace;fill:var(--mute);letter-spacing:.04em}
.ed.dash{fill:none;stroke-dasharray:3 4}
.nd.hub rect{stroke:rgba(245,246,248,.32)}.nd.done rect{stroke:rgba(245,246,248,.4)}
.nd.on rect{stroke:var(--acc);fill:rgba(255,201,38,.09)}.nd.on .a{fill:var(--acc)}
.ed{stroke:rgba(245,246,248,.16);stroke-width:1.2;fill:none}.ed.on{stroke:rgba(255,201,38,.6)}
#comet{fill:var(--core);filter:drop-shadow(0 0 6px #FFC926)}
.mt{font:500 11px "Mono UI","JetBrains Mono",monospace;fill:var(--mute);letter-spacing:.12em}
.acts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 18px;align-items:center;padding-top:18px;border-top:1px solid var(--line)}
.acts>button{height:56px;min-width:150px;padding:0 24px;font:800 22px var(--sans);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;border-radius:var(--r)}
#make{background:var(--acc);color:var(--ink);border:2px solid var(--acc)}
#replay{background:transparent;color:var(--text);border:2px solid var(--line)}#replay:not(:disabled):hover{border-color:var(--text)}
button:disabled{opacity:.35;cursor:not-allowed}
.what b{color:var(--text);font-weight:700}
.rp{display:flex;flex-direction:column;gap:6px;align-items:stretch}
#rnote.bad{color:var(--bad)}

.frame{height:min(64vh,720px);aspect-ratio:9/16;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);position:relative;overflow:hidden;border-radius:var(--r)}
.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.dot{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--mute)}
.state{position:absolute;inset:auto 24px 50% 24px;transform:translateY(50%);text-align:center}
.state .word{font:700 30px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.08em}
.state .sub{margin-top:10px;min-height:22px}
.line{height:3px;background:var(--line);margin-top:20px;position:relative}
.line i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);transition:width .6s}
#playboth{all:unset;cursor:pointer;color:var(--acc);font:700 14px var(--mono);letter-spacing:.1em;margin-left:14px}
.under{display:flex;flex-wrap:wrap;gap:4px 14px;font:500 15px var(--mono);color:var(--mute);max-width:calc(min(64vh,720px)*9/16)}
.under a{color:var(--acc);text-decoration:none}.under .why{flex-basis:100%;color:var(--bad)}.under .skn{color:var(--acc)}
.frame.flash{border-color:var(--acc);transition:border-color .2s}
.st{font-weight:700}.DONE,.BUILT,.HAVE{color:var(--ok)}.FAILED,.ERROR{color:var(--bad)}.RUNNING{color:var(--acc)}


@media (max-width:1200px){
 body{font-size:18px}
 header{flex-wrap:wrap;gap:10px 20px;padding:14px 18px}
 main{grid-template-columns:1fr 1fr}
 .col{padding:18px}.col.s{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--line)}
 textarea{font-size:28px}#picks .t{font-size:22px}
 .frame{height:auto;width:100%}.head b,.under{max-width:100%}
 #skills{left:12px;width:calc(100vw - 24px)}
}
@media (max-width:600px){textarea{font-size:22px}#picks .t{font-size:18px}h1{font-size:24px}
 .acts{grid-template-columns:1fr}.acts>button{width:100%}.col{padding:14px 12px}}
</style>
<canvas id="space"></canvas>
<header><h1>Crea<span>t</span>ure</h1><div class="dd" id="home"></div>
<button id="skillsbtn">what it learned <span id="nskills" hidden></span>▾</button>
<div id="skills"></div></header>
<main>
<section class="col s">
 <div class="cap"><i>1</i>Script · one line = one shot</div>
 <div class="script"><textarea id="lines" spellcheck="false">Night shift.
Seventeen reels.
One creature.
Zero new authority.</textarea><div id="picks"></div><button id="edit" hidden>✎ edit script</button></div>
 <div id="how"><svg id="flow" viewBox="0 0 600 264" preserveAspectRatio="xMidYMid meet" role="img" aria-label="how the creature works"></svg><div id="say"></div></div>
 <div class="acts">
  <button id="make">Make</button><span class="sub what"><b>new video</b> · AI picks a screen per line · ~$0.02 · ~2 min</span>
  <button id="replay">Replay</button><span class="sub rp"><span class="dd" id="design"></span><span id="rnote"></span></span>
 </div>
</section>
<section class="col">
 <div class="head"><div class="cap"><i>2</i>Learned from</div><b id="lname">—</b></div>
 <div class="frame" id="learned"><div class="dot"></div></div>
 <div class="under" id="lsub"></div>
</section>
<section class="col">
 <div class="head"><div class="cap"><i>3</i>Result<button id="playboth">▶ PLAY BOTH</button></div><b id="mname">—</b></div>
 <div class="frame" id="frame"><div class="dot"></div></div>
 <div class="under" id="under"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);let home="",designs=[],sources=[],busy=false;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const file=p=>`/file?home=${encodeURIComponent(home)}&path=${encodeURIComponent(p)}`;
const usd=x=>"$"+Number(x||0).toFixed(3);
const FIRST=["mikro-s-knihovnou","uceni-ok"];  // the night's two main homes; the rest are one reel each or comparisons
let pick={home:"",design:""},homeList=[];
async function j(u,o){const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);return d}
async function homes(){const hs=await j("/api/homes");
 homeList=hs;const names=hs.map(h=>h.name);home=names.includes(back.get("home"))?back.get("home"):names.includes("mikro-s-knihovnou")?"mikro-s-knihovnou":names[0]||"";homeMenu();const c=await j("/api/current");if(!c.job)await load()}
function dropdown(el,items,current,onpick,empty){  // items: {value,label,meta,group,bad}
 const now=items.find(x=>x.value===current);
 el.innerHTML=`<button type="button"><span class="v">${esc(now?now.label:empty||"—")}</span>${now&&now.meta?`<span class="m">${esc(now.meta)}</span>`:""}<span class="chev"></span></button><ul>${items.map(x=>x.group?`<li class="g">${esc(x.group)}</li>`:`<li data-v="${esc(x.value)}" class="${x.value===current?"on":""} ${x.bad?"bad":""}"><span class="v">${esc(x.label)}</span><span class="m">${esc(x.meta||"")}</span></li>`).join("")}</ul>`;
 el.querySelector("button").onclick=e=>{e.stopPropagation();skillsOpen(false);const open=!el.classList.contains("open");document.querySelectorAll(".dd.open").forEach(d=>d.classList.remove("open"));
  if(!open||!items.length)return;const r=el.getBoundingClientRect();el.classList.toggle("up",innerHeight-r.bottom<320&&r.top>innerHeight-r.bottom);el.classList.add("open")};
 el.querySelectorAll("li[data-v]").forEach(li=>li.onclick=e=>{e.stopPropagation();el.classList.remove("open");onpick(li.dataset.v)})}
document.addEventListener("click",()=>document.querySelectorAll(".dd.open").forEach(d=>d.classList.remove("open")));
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".dd.open").forEach(d=>d.classList.remove("open"))});
function homeMenu(){const it=h=>({value:h.name,label:h.name,meta:`${h.skills} ${h.skills==1?"skill":"skills"}`});
 const top=FIRST.map(n=>homeList.find(h=>h.name===n)).filter(Boolean),rest=homeList.filter(h=>!FIRST.includes(h.name)).sort((a,b)=>b.skills-a.skills);
 dropdown($("home"),[...top.map(it),...(rest.length?[{group:"other homes"}]:[]),...rest.map(it)],home,setHome)}
function designMenu(){const n=count();
 dropdown($("design"),designs.map(x=>({value:x.name,label:x.name,meta:`${x.steps} ${x.steps==1?"line":"lines"}`,bad:!fits(x,n)})),pick.design,v=>{pick.design=v;designMenu();check()},"nothing saved yet")}
let gen=0;  // a newer home choice wins: answers for an older one are dropped
function blank(){["frame","learned"].forEach(id=>$(id).innerHTML='<div class="dot"></div>');$("lname").textContent=$("mname").textContent="—";
 ["under","lsub","picks"].forEach(id=>$(id).innerHTML="");sources=[];editing()}
async function load(){const g=gen;const d=await j("/api/home?name="+encodeURIComponent(home));if(g!==gen)return;
 $("nskills").textContent=d.skills.length;
 $("skills").innerHTML=d.skills.map(s=>`<button class="sk" data-slug="${esc(s.slug)}" title="${esc(s.effect)}"><span class="sw">${(s.colors||[]).map(c=>`<i style="background:${esc(c)}"></i>`).join("")}</span><span class="n">${esc(s.slug)}</span><span class="m">${[s.tone,s.seconds!=null?s.seconds+" s":"",s.text_share!=null?"text "+Math.round(s.text_share*100)+" %":""].filter(Boolean).map(esc).join(" · ")}</span><span class="e">${esc(s.effect)}</span></button>`).join("")||'<div class="none">Nothing learned yet.</div>';
 $("skills").querySelectorAll(".sk").forEach(b=>b.onclick=e=>{e.stopPropagation();skillsOpen(false);origin(b.dataset.slug)});
 const keep=pick.design;designs=d.designs.slice().sort((a,b)=>(b.name.startsWith("make")-a.name.startsWith("make"))||b.name.localeCompare(a.name,undefined,{numeric:true}));
 if(designs.some(x=>x.name===keep))pick.design=keep;else{pick.design="";fit()}designMenu();
 check();
 if(!shown){const best=d.runs.find(r=>r.status==="DONE"&&r.clip&&r.spent>0)||d.runs.find(r=>r.clip),was=back.get("run");back.delete("run");
  (was?show(was).catch(()=>best&&show(best.run)):best?show(best.run):Promise.resolve()).then(scrollBack)}}
function count(){return $("lines").value.split("\n").map(s=>s.trim()).filter(Boolean).length}
const fits=(d,n)=>!!d&&(n===1||n===d.steps);  // replay takes one text for every step, or one per step
function fit(){const n=count();const d=designs.find(x=>x.steps===n)||(n===1&&designs[0]);if(d)pick.design=d.name;else if(!designs.some(x=>x.name===pick.design))pick.design=designs[0]?designs[0].name:"";designMenu()}
function check(){const n=count();const d=designs.find(x=>x.name===pick.design);const ok=fits(d,n);
 const sizes=[...new Set(designs.map(x=>x.steps))].sort((a,b)=>a-b);
 $("rnote").textContent=!d?"":ok?"same video, your words · no AI · $0":designs.some(x=>x.steps===n)?`needs ${d.steps} ${d.steps==1?"line":"lines"}, you have ${n}`:`no saved video has ${n} lines · write ${[...new Set([1,...sizes])].join(", ")}`;
 $("rnote").className=d&&!ok?"bad":"";$("replay").disabled=busy||!ok;$("make").disabled=busy||!n}
function source(x,play){if(!x){$("learned").innerHTML='<div class="dot"></div>';$("lname").textContent="—";$("lsub").innerHTML="";return}
 const url=x.src?(x.src.startsWith("file:")?file(x.src.slice(5)):`/reel?home=${encodeURIComponent(home)}&${x.src.slice(5)}`):null;
 $("learned").innerHTML=url?`<video id="va" src="${url}${play?"":"#t=1.2"}" loop muted playsinline preload="auto" controls></video>`:'<div class="state"><div class="sub">reel not on this machine</div></div>';
 if(play){const v=$("va");if(v)v.play().catch(()=>{});$("learned").classList.add("flash");setTimeout(()=>$("learned").classList.remove("flash"),700)}
 $("lname").textContent=x.reel||"—";
 $("lsub").innerHTML=(x.skill?`<span class="skn">${esc(x.skill)}</span>`:"")+(x.learn_usd!=null?`<span>learned for ${usd(x.learn_usd)}</span>`:"")+(x.attempts?`<span>${x.attempts} tries</span>`:"");
 document.querySelectorAll("#picks .chip").forEach(c=>c.classList.toggle("on",c.dataset.skill===x.skill))}
let shown="";
async function show(run){shown=run;const g=gen;const r=await j(`/api/run?home=${encodeURIComponent(home)}&run=${encodeURIComponent(run)}`);if(g!==gen)return;
 const p=r.progress||{};const st=r.status;
 $("frame").innerHTML=r.clip?`<video id="vb" src="${file(r.clip)}#t=1.2" loop playsinline preload="auto" controls muted></video>`:`<div class="state"><div class="word ${esc(st)}">${esc(st)}</div><div class="sub">${esc(r.gap.slice(0,160))}</div></div>`;
 $("mname").textContent=r.kind==="learn"?"learning run":`${r.lines.length} ${r.lines.length==1?"line":"lines"} · ${r.kind==="design"?"replay":r.kind}`;
 sources=r.learned||[];
 $("under").innerHTML=`<span class="st ${esc(st)}">${esc(st)}</span><span>${usd(p.spent)}</span><span>${p.calls||0} AI calls</span>${r.seconds!=null?`<span>${r.seconds} s</span>`:""}<a href="/h/${encodeURIComponent(home)}/${encodeURIComponent(run)}/page.html" target="_blank">details</a>${r.clip&&r.gap&&st!=="DONE"?`<span class="why">${esc(r.gap.split(/(?<=\.)\s/)[0].slice(0,140))}</span>`:""}`;
 remember();editing();if(r.kind==="make"||r.kind==="design"){$("lines").value=r.lines.join("\n");if(r.kind==="make")picks(r.lines,p.picks)}
 const first=((p.picks||[]).find(x=>x.skill)||{}).skill;source(sources.find(x=>x.src&&x.skill===first)||sources.find(x=>x.src)||sources[0]);
 check()}
function picks(lines,list){if(!list||!list.length)return;const by={};list.forEach(p=>by[p.line]=p);
 $("picks").innerHTML=lines.map((l,i)=>{const p=by[i+1];return `<div><span class="t">${esc(l)}</span>${p&&p.skill?`<button class="chip" data-skill="${esc(p.skill)}" title="${esc(p.why)}">${esc(p.skill)}</button>`:`<span class="chip none">—</span>`}</div>`}).join("");
 $("picks").querySelectorAll("button.chip").forEach(c=>c.onclick=()=>source(sources.find(x=>x.skill===c.dataset.skill),true));
 $("picks").classList.add("on");$("lines").style.display="none";$("edit").hidden=false}
function editing(){$("picks").classList.remove("on");$("lines").style.display="";$("edit").hidden=true}
function working(p){const w=(p&&p.word)||"STARTING";const of=p&&p.of?p.of:0;const step=p?p.step:0;
 const share=w==="JUDGED"?100:w==="JOINING"||w==="JUDGING"?92:of?Math.round(85*step/of)+(w==="RENDERING"?5:0):5;
 $("frame").innerHTML=`<div class="state"><div class="word RUNNING">${esc(w)}</div><div class="sub">${w==="RENDERING"&&of?`shot ${Math.min(step+1,of)} / ${of}`:""}${p&&p.attempt>1?` · try ${p.attempt}`:""}${p&&p.calls?` · ${p.calls} AI calls`:""}</div><div class="line"><i style="width:${share}%"></i></div></div>`}
function done(job,lines){if(job.run){show(job.run);return}const p=job.progress||{};const st=job.status||p.word||"?";
 $("frame").innerHTML=job.clip?`<video id="vb" src="${file(job.clip)}" loop playsinline preload="auto" controls muted></video>`:`<div class="state"><div class="word ${esc(st)}">${esc(st)}</div><div class="sub">${esc((job.gap||"").slice(0,160))}</div></div>`;
 $("under").innerHTML=`<span class="st ${esc(st)}">${esc(st)}</span><span>${usd(p.spent)}</span><span>${p.calls||0} AI calls</span>`;
 if(job.kind==="make")picks(lines,p.picks)}
async function go(kind){const lines=$("lines").value.split("\n").map(s=>s.trim()).filter(Boolean);
 const body={home,lines,style:false,sound:false,design:pick.design};
 try{const {job}=await j("/api/"+kind,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  await follow(job,kind,lines)}catch(e){fail(e)}}
function fail(e){$("frame").innerHTML=`<div class="state"><div class="word ERROR">ERROR</div><div class="sub">${esc(e.message)}</div></div>`;busy=false;check()}
async function follow(job,kind,lines){busy=true;check();editing();$("under").innerHTML="";
 $("mname").textContent=`${lines.length} ${lines.length==1?"line":"lines"} · ${kind==="make"?"make":"replay"}`;working(null);
 try{for(;;){const s=await j("/api/job?id="+job);
   if(s.state==="done"){done(s,lines);break}working(s.progress);if(kind==="make")picks(lines,s.progress&&s.progress.picks);
   await new Promise(r=>setTimeout(r,1500))}
 }catch(e){fail(e);return}
 busy=false;load()}
async function resume(){const c=await j("/api/current");if(!c.job)return false;
 if(c.home!==home){home=c.home;homeMenu()}$("lines").value=(c.lines||[]).join("\n");
 shown="(running)";await load();follow(c.job,c.kind,c.lines||[]);return true}
function setHome(h){if(h===home)return;home=h;homeMenu();shown="";gen++;blank();remember();load()}
function remember(){const q=new URLSearchParams({home});if(shown&&shown!=="(running)")q.set("run",shown);history.replaceState(null,"","#"+q)}
const back=new URLSearchParams(location.hash.slice(1));history.scrollRestoration="manual";
addEventListener("beforeunload",()=>{try{sessionStorage.setItem("y",String(scrollY))}catch(e){}});
function scrollBack(){let y=0;try{y=+sessionStorage.getItem("y")||0}catch(e){}if(y)setTimeout(()=>scrollTo(0,y),60)}
$("make").onclick=()=>go("make");$("replay").onclick=()=>go("design");
$("lines").oninput=()=>{if(!fits(designs.find(x=>x.name===pick.design),count()))fit();else designMenu();check()};
$("edit").onclick=editing;$("playboth").onclick=()=>{["va","vb"].forEach(id=>{const v=$(id);if(v){v.currentTime=0;v.play()}})};
function skillsOpen(on){$("skills").classList.toggle("open",on);$("skillsbtn").classList.toggle("on",on)}
async function origin(slug){const g=gen;const x=await j(`/api/skill?home=${encodeURIComponent(home)}&skill=${encodeURIComponent(slug)}`);if(g===gen)source(x||{skill:slug})}
$("skillsbtn").onclick=e=>{e.stopPropagation();document.querySelectorAll(".dd.open").forEach(d=>d.classList.remove("open"));skillsOpen(!$("skills").classList.contains("open"))};

document.addEventListener("keydown",e=>{if(e.key==="Escape")skillsOpen(false)});
homes().then(resume);
(()=>{  // how it works, in general: an illustration on a loop, not a live run
 const W=112,H=74,X=[0,122,244,366,488],Y={L:34,M:186};
 const N={reel:["L",0,"Reel","from Instagram","Apify"],opus:["L",1,"Opus","writes the code","Claude API"],sbx1:["L",2,"Sandbox","runs the code","Docker · offline"],
  jdg1:["L",3,"Judge","checks + Haiku","Claude API"],reg:["L",4,"Registry","skill saved","disk"],
  script:["M",0,"Script","your lines","you"],haiku:["M",1,"Haiku","picks skills","Claude API"],sbx2:["M",2,"Sandbox","renders shots","Docker · offline"],
  jdg2:["M",3,"Judge","checks + Haiku","Claude API"],video:["M",4,"Video","mp4","file"]};
 const S=[["LEARN","reel","","A reel comes in, downloaded via Apify."],["LEARN","opus","reel","Opus writes the missing skill as Python code.",1],
  ["LEARN","sbx1","opus","The code runs in Docker: no network, no keys."],["LEARN","jdg1","sbx1","Fixed checks, then a Haiku judge. Fail: Opus tries again.",1],
  ["LEARN","reg","jdg1","Pass: saved as a skill, with tests and a version."],
  ["MAKE","script","","Later: your script, one line per shot."],["MAKE","haiku","script","Haiku picks a learned skill for each line.",1],
  ["MAKE","sbx2","haiku","Each shot renders in the sandbox."],["MAKE","jdg2","sbx2","The judge checks every line is readable.",1],
  ["MAKE","video","jdg2","Video. Replay with new words: $0, no AI."]];
 const svg=$("flow"),ns="http://www.w3.org/2000/svg",nodes={},links={};
 const el=(t,a,p)=>{const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e};
 const box=k=>{const [r,c]=N[k];return {x:X[c],y:Y[r]}};
 el("text",{x:0,y:Y.L-12,class:"mt"}).textContent="LEARN · ONCE PER REEL";el("text",{x:0,y:Y.M-12,class:"mt"}).textContent="MAKE · EVERY VIDEO";
 const reg=box("reg"),hk=box("haiku");
 links.reg=el("path",{d:`M${reg.x+W/2} ${reg.y+H} V${Y.M-28} H${hk.x+W/2} V${hk.y}`,class:"ed dash"});
 el("text",{x:reg.x+W/2-6,y:Y.M-32,"text-anchor":"end",class:"mt"}).textContent="LEARNED SKILLS";
 for(const s of S)if(s[2]){const a=box(s[2]),b=box(s[1]);links[s[1]]=el("line",{x1:a.x+W,y1:a.y+H/2,x2:b.x,y2:b.y+H/2,class:"ed"})}
 for(const k in N){const {x,y}=box(k),[, ,a,b,c]=N[k],g=el("g",{class:"nd"});el("rect",{x,y,width:W,height:H,rx:9},g);
  el("text",{x:x+W/2,y:y+25,"text-anchor":"middle",class:"a"},g).textContent=a;el("text",{x:x+W/2,y:y+44,"text-anchor":"middle",class:"b"},g).textContent=b;
  el("text",{x:x+W/2,y:y+61,"text-anchor":"middle",class:"c"},g).textContent=c;nodes[k]=g}
 const comet=el("circle",{r:4.5,id:"comet",opacity:0});
 const STEP=2100,RIDE=650,HOLD=3000;let i=-1,t0=0;
 function go(n,now){if(i>=0&&i<S.length){nodes[S[i][1]].classList.remove("on");nodes[S[i][1]].classList.add("done");Object.values(links).forEach(l=>l.classList.remove("on"))}
  i=n;t0=now;if(i===0)Object.values(nodes).forEach(g=>g.classList.remove("on","done"));if(i>=S.length){comet.setAttribute("opacity",0);return}
  const s=S[i],same=S.filter(x=>x[0]===s[0]);if(links[s[1]])links[s[1]].classList.add("on");if(s[1]==="haiku")links.reg.classList.add("on");
  if(!s[2])nodes[s[1]].classList.add("on");$("say").innerHTML=`<b>${s[0]} ${same.indexOf(s)+1}/${same.length}</b>${esc(s[3])}`}
 function tick(now){if(i<0)go(0,now);const e=now-t0;
  if(i<S.length){const s=S[i];if(s[2]){const a=box(s[2]),b=box(s[1]),p=Math.min(1,e/RIDE),k=p<.5?2*p*p:1-2*(1-p)*(1-p);
    comet.setAttribute("cx",a.x+W+(b.x-a.x-W)*k);comet.setAttribute("cy",a.y+H/2);comet.setAttribute("opacity",p<1?1:0);
    if(p===1)nodes[s[1]].classList.add("on")}
   if(e>=STEP)go(i+1,now)}
  else if(e>=HOLD)go(0,now);
  requestAnimationFrame(tick)}
 if(matchMedia("(prefers-reduced-motion: reduce)").matches){$("say").textContent="Learn once from a reel; make many videos from a script."}
 else requestAnimationFrame(tick)})();
(()=>{  // the video's night: near-black, two slow navy clouds, rising dust, a vignette
 const c=$("space"),x=c.getContext("2d"),dust=[];let w=0,h=0;
 const size=()=>{const d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0)};
 size();addEventListener("resize",()=>{size();if(still)frame(0)});
 for(let i=0;i<90;i++)dust.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.6,a:.06+Math.random()*.22,v:5+Math.random()*12,p:Math.random()*6.283,gold:Math.random()<.18});
 const cloud=(cx,cy,r,stops)=>{const g=x.createRadialGradient(cx,cy,0,cx,cy,r);stops.forEach(([o,col])=>g.addColorStop(o,col));x.fillStyle=g;x.fillRect(0,0,w,h)};
 function frame(t){const s=t/1000,T=6.283;x.fillStyle="#05070D";x.fillRect(0,0,w,h);
  cloud(w*.28+160*Math.sin(s*T/100),h*.35+90*Math.sin(s*T/120),760,[[0,"rgba(31,48,104,.55)"],[.45,"rgba(20,27,51,.22)"],[1,"rgba(20,27,51,0)"]]);
  cloud(w*.74+160*Math.sin(s*T/110+2),h*.70+90*Math.cos(s*T/95),820,[[0,"rgba(26,38,86,.5)"],[1,"rgba(26,38,86,0)"]]);
  for(const d of dust){const y=((d.y*h-d.v*s)%(h+20)+h+20)%(h+20)-10,px=d.x*w+8*Math.sin(s*.5+d.p),tw=.6+.4*Math.sin(s*1.7+d.p*3);
   x.fillStyle=d.gold?`rgba(255,201,38,${d.a*tw})`:`rgba(245,246,248,${d.a*tw})`;x.beginPath();x.arc(px,y,d.r,0,T);x.fill()}
  const v=x.createRadialGradient(w/2,h/2,Math.min(w,h)*.42,w/2,h/2,Math.hypot(w,h)/2);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(0,0,0,.7)");x.fillStyle=v;x.fillRect(0,0,w,h)}
 const still=matchMedia("(prefers-reduced-motion: reduce)").matches;let last=-99;
 const loop=t=>{if(t-last>=33){last=t;frame(t)}requestAnimationFrame(loop)};
 if(still)frame(0);else requestAnimationFrame(loop)})();
