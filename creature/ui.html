<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creature</title>
<style>
@font-face{font-family:"Barlow UI";src:local("Barlow"),url(/font/barlow-regular.ttf);font-weight:400}
@font-face{font-family:"Barlow UI";src:local("Barlow SemiBold"),url(/font/barlow-semibold.ttf);font-weight:600}
@font-face{font-family:"Barlow UI";src:local("Barlow ExtraBold"),url(/font/barlow-extrabold.ttf);font-weight:800}
@font-face{font-family:"Mono UI";src:local("JetBrains Mono"),url(/font/jetbrainsmono.ttf);font-weight:100 800}
:root{--bg:#1B2135;--panel:#151a2b;--text:#EBEDF2;--acc:#D4A574;--ink:#1B2135;--line:rgba(235,237,242,.14);
  --mute:rgba(235,237,242,.5);--ok:#7fd49a;--bad:#ff7a6b;--r:0;
  --sans:"Barlow UI","Barlow",system-ui,sans-serif;--mono:"Mono UI","JetBrains Mono",ui-monospace,Menlo,monospace}
body.video{--bg:#05070D;--panel:#0B1022;--text:#F5F6F8;--acc:#FFC926;--ink:#05070D;--mute:rgba(245,246,248,.45);--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:400 20px/1.4 var(--sans);min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit}
.cap{font:500 14px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--mute)}
.cap i{font-style:normal;color:var(--acc);margin-right:10px}
.sub{font:500 15px/1.4 var(--mono);color:var(--mute)}

header{display:flex;align-items:center;gap:24px;padding:16px 32px;border-bottom:1px solid var(--line);position:relative}
h1{font:800 30px/1 var(--sans);letter-spacing:.03em;margin:0;text-transform:uppercase}h1 span{color:var(--acc)}
select{font:500 17px var(--mono);color:var(--text);background:transparent;border:0;border-bottom:1px solid var(--line);padding:4px 2px;border-radius:0;max-width:100%}
select option,select optgroup{background:var(--bg);color:var(--text)}
#skillsbtn{all:unset;cursor:pointer;font:500 16px var(--mono);color:var(--mute)}#skillsbtn b{color:var(--text);font-size:20px}#skillsbtn:hover{color:var(--acc)}
#skills{display:none;position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding:14px 32px 18px;columns:3;column-gap:36px;max-height:60vh;overflow:auto}
#skills.open{display:block}
#skills details{break-inside:avoid;padding:5px 0}
#skills summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;font:600 18px var(--sans)}
#skills summary::-webkit-details-marker{display:none}
#skills p{margin:4px 0 6px 44px;font-size:15px;color:var(--mute)}
.sw{display:flex;gap:2px;flex:none}.sw i{width:10px;height:10px;outline:1px solid var(--line)}

main{flex:1;display:grid;grid-template-columns:minmax(340px,1fr) auto auto}
.col{padding:24px 32px;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--line);min-width:0}
.col:last-child{border-right:0}
.head{min-height:58px}.head b{display:block;font:700 20px/1.3 var(--sans);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:calc(min(64vh,720px)*9/16)}

.script{flex:1;min-height:0;display:flex;flex-direction:column}
textarea{flex:1;min-height:200px;width:100%;background:transparent;border:0;color:var(--text);resize:none;outline:none;padding:0;
  font:600 34px/1.45 var(--sans)}
#picks{display:none;flex:1;overflow:auto}#picks.on{display:block}
#picks div{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid var(--line)}
#picks .t{font:600 26px/1.25 var(--sans)}
#picks .chip{all:unset;flex:none;cursor:pointer;font:500 14px var(--mono);color:var(--acc);white-space:nowrap}
#picks .chip:hover,#picks .chip.on{text-decoration:underline}#picks .chip.none{color:var(--mute);cursor:default}
#edit{all:unset;cursor:pointer;font:500 14px var(--mono);color:var(--mute);margin-top:10px}#edit:hover{color:var(--acc)}#edit[hidden]{display:none}

.acts{display:grid;grid-template-columns:auto 1fr;gap:12px 18px;align-items:center;padding-top:18px;border-top:1px solid var(--line)}
.acts button{height:56px;min-width:150px;padding:0 24px;font:800 22px var(--sans);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;border-radius:var(--r)}
#make{background:var(--acc);color:var(--ink);border:2px solid var(--acc)}
#replay{background:transparent;color:var(--text);border:2px solid var(--line)}#replay:not(:disabled):hover{border-color:var(--text)}
button:disabled{opacity:.35;cursor:not-allowed}
.what b{color:var(--text);font-weight:700}
.rp{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
#rnote.bad{color:var(--bad)}

.frame{height:min(64vh,720px);aspect-ratio:9/16;background:var(--panel);position:relative;overflow:hidden;border-radius:var(--r)}
.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.dot{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:var(--acc);opacity:.4}
.state{position:absolute;inset:auto 24px 50% 24px;transform:translateY(50%);text-align:center}
.state .word{font:700 30px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.08em}
.state .sub{margin-top:10px;min-height:22px}
.line{height:3px;background:var(--line);margin-top:20px;position:relative}
.line i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);transition:width .6s}
#playboth{all:unset;cursor:pointer;color:var(--acc);font:700 14px var(--mono);letter-spacing:.1em;margin-left:14px}
.under{display:flex;flex-wrap:wrap;gap:4px 14px;font:500 15px var(--mono);color:var(--mute);max-width:calc(min(64vh,720px)*9/16)}
.under a{color:var(--acc);text-decoration:none}
.st{font-weight:700}.DONE,.BUILT,.HAVE{color:var(--ok)}.FAILED,.ERROR{color:var(--bad)}.RUNNING{color:var(--acc)}


@media (max-width:1200px){
 body{font-size:18px}
 header{flex-wrap:wrap;gap:10px 20px;padding:14px 18px}
 main{grid-template-columns:1fr 1fr}
 .col{padding:18px}.col.s{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--line)}
 textarea{font-size:28px;min-height:180px}#picks .t{font-size:22px}
 .frame{height:auto;width:100%}.head b,.under{max-width:100%}
 #skills{columns:1;padding:12px 18px}
}
@media (max-width:600px){textarea{font-size:22px}#picks .t{font-size:18px}h1{font-size:24px}
 .acts{grid-template-columns:1fr}.acts button{width:100%}.col{padding:14px 12px}}
</style>
<header><h1>Crea<span>t</span>ure</h1><select id="home" title="home: one creature with its own skills, runs and budget"></select>
<button id="skillsbtn"><b id="nskills">0</b> skills</button>
<div id="skills"></div></header>
<main>
<section class="col s">
 <div class="cap"><i>1</i>Script · one line = one shot</div>
 <div class="script"><textarea id="lines" spellcheck="false">Night shift.
Seventeen reels.
One creature.
Zero new authority.</textarea><div id="picks"></div><button id="edit" hidden>✎ edit script</button></div>
 <div class="acts">
  <button id="make">Make</button><span class="sub what"><b>new video</b> · AI picks a screen per line · ~$0.02</span>
  <button id="replay">Replay</button><span class="sub rp"><select id="design" title="saved video to replay"></select><span id="rnote"></span></span>
 </div>
</section>
<section class="col">
 <div class="head"><div class="cap"><i>2</i>Learned from</div><b id="lname">—</b></div>
 <div class="frame" id="learned"><div class="dot"></div></div>
 <div class="under" id="lsub"></div>
</section>
<section class="col">
 <div class="head"><div class="cap"><i>3</i>Result<button id="playboth">▶ PLAY BOTH</button></div><b id="mname">—</b></div>
 <div class="frame" id="frame"><div class="dot"></div></div>
 <div class="under" id="under"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);let home="",designs=[],sources=[],busy=false;
if(new URLSearchParams(location.search).has("video"))document.body.classList.add("video");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const file=p=>`/file?home=${encodeURIComponent(home)}&path=${encodeURIComponent(p)}`;
const usd=x=>"$"+Number(x||0).toFixed(3);
const TEST=/^(opus-|creature-|lilium-|dbg-)/;  // comparison and test homes: listed, but apart
async function j(u,o){const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);return d}
async function homes(){const hs=await j("/api/homes");const opt=h=>`<option>${esc(h)}</option>`;
 $("home").innerHTML=hs.filter(h=>!TEST.test(h)).map(opt).join("")+`<optgroup label="tests">${hs.filter(h=>TEST.test(h)).map(opt).join("")}</optgroup>`;
 home=hs.includes("mikro-s-knihovnou")?"mikro-s-knihovnou":hs[0];$("home").value=home;const c=await j("/api/current");if(!c.job)await load()}
let gen=0;  // a newer home choice wins: answers for an older one are dropped
function blank(){["frame","learned"].forEach(id=>$(id).innerHTML='<div class="dot"></div>');$("lname").textContent=$("mname").textContent="—";
 ["under","lsub","picks"].forEach(id=>$(id).innerHTML="");sources=[];editing()}
async function load(){const g=gen;const d=await j("/api/home?name="+encodeURIComponent(home));if(g!==gen)return;
 $("nskills").textContent=d.skills.length;
 $("skills").innerHTML=d.skills.map(s=>`<details><summary><span class="sw">${(s.colors||[]).map(c=>`<i style="background:${esc(c)}"></i>`).join("")}</span>${esc(s.slug)}</summary><p>${esc(s.effect)}<br><span class="sub">${s.tone?esc(s.tone)+" · ":""}${s.seconds??"?"} s${s.text_share!=null?" · text "+Math.round(s.text_share*100)+" %":""}</span></p></details>`).join("")||"Nothing learned yet.";
 const keep=$("design").value;designs=d.designs.slice().sort((a,b)=>(b.name.startsWith("make")-a.name.startsWith("make"))||b.name.localeCompare(a.name,undefined,{numeric:true}));
 $("design").innerHTML=designs.map(x=>`<option value="${esc(x.name)}">${esc(x.name)} · ${x.steps} ${x.steps==1?"line":"lines"}</option>`).join("")||"<option value=''>nothing saved yet</option>";
 if(designs.some(x=>x.name===keep))$("design").value=keep;else fit();
 check();
 if(!shown){const best=d.runs.find(r=>r.status==="DONE"&&r.clip&&r.spent>0)||d.runs.find(r=>r.clip);if(best)show(best.run)}}
function count(){return $("lines").value.split("\n").map(s=>s.trim()).filter(Boolean).length}
const fits=(d,n)=>!!d&&(n===1||n===d.steps);  // replay takes one text for every step, or one per step
function fit(){const n=count();const d=designs.find(x=>x.steps===n)||designs.find(x=>x.steps===1);if(d)$("design").value=d.name}
function check(){const n=count();const d=designs.find(x=>x.name===$("design").value);const ok=fits(d,n);
 $("rnote").textContent=!d?"":ok?"same video, your words · no AI · $0":`needs ${d.steps} ${d.steps==1?"line":"lines"}, you have ${n}`;
 $("rnote").className=d&&!ok?"bad":"";$("replay").disabled=busy||!ok;$("make").disabled=busy||!n}
function source(x){if(!x){$("learned").innerHTML='<div class="dot"></div>';$("lname").textContent="—";$("lsub").innerHTML="";return}
 const url=x.src?(x.src.startsWith("file:")?file(x.src.slice(5)):`/reel?home=${encodeURIComponent(home)}&${x.src.slice(5)}`):null;
 $("learned").innerHTML=url?`<video id="va" src="${url}" loop muted playsinline preload="auto" controls></video>`:'<div class="state"><div class="sub">reel not on this machine</div></div>';
 $("lname").textContent=x.reel||"—";
 $("lsub").innerHTML=(x.skill?`<span>${esc(x.skill)}</span>`:"")+(x.learn_usd!=null?`<span>learned for ${usd(x.learn_usd)}</span>`:"")+(x.attempts?`<span>${x.attempts} tries</span>`:"");
 document.querySelectorAll("#picks .chip").forEach(c=>c.classList.toggle("on",c.dataset.skill===x.skill))}
let shown="";
async function show(run){shown=run;const g=gen;const r=await j(`/api/run?home=${encodeURIComponent(home)}&run=${encodeURIComponent(run)}`);if(g!==gen)return;
 const p=r.progress||{};const st=r.status;
 $("frame").innerHTML=r.clip?`<video id="vb" src="${file(r.clip)}" loop playsinline preload="auto" controls muted></video>`:`<div class="state"><div class="word ${esc(st)}">${esc(st)}</div><div class="sub">${esc(r.gap.slice(0,160))}</div></div>`;
 $("mname").textContent=r.kind==="learn"?"learning run":`${r.lines.length} ${r.lines.length==1?"line":"lines"} · ${r.kind==="design"?"replay":r.kind}`;
 sources=r.learned||[];
 $("under").innerHTML=`<span class="st ${esc(st)}">${esc(st)}</span><span>${usd(p.spent)}</span><span>${p.calls||0} AI calls</span>${r.seconds!=null?`<span>${r.seconds} s</span>`:""}<a href="${file(run+"/page.html")}" target="_blank">details</a>`;
 editing();if(r.kind==="make"||r.kind==="design"){$("lines").value=r.lines.join("\n");if(r.kind==="make")picks(r.lines,p.picks)}
 const first=((p.picks||[]).find(x=>x.skill)||{}).skill;source(sources.find(x=>x.src&&x.skill===first)||sources.find(x=>x.src)||sources[0]);
 check()}
function picks(lines,list){if(!list||!list.length)return;const by={};list.forEach(p=>by[p.line]=p);
 $("picks").innerHTML=lines.map((l,i)=>{const p=by[i+1];return `<div><span class="t">${esc(l)}</span>${p&&p.skill?`<button class="chip" data-skill="${esc(p.skill)}" title="${esc(p.why)}">${esc(p.skill)}</button>`:`<span class="chip none">—</span>`}</div>`}).join("");
 $("picks").querySelectorAll("button.chip").forEach(c=>c.onclick=()=>source(sources.find(x=>x.skill===c.dataset.skill)));
 $("picks").classList.add("on");$("lines").style.display="none";$("edit").hidden=false}
function editing(){$("picks").classList.remove("on");$("lines").style.display="";$("edit").hidden=true}
function working(p){const w=(p&&p.word)||"STARTING";const of=p&&p.of?p.of:0;const step=p?p.step:0;
 const share=w==="JUDGED"?100:of?Math.round(85*step/of)+(w==="RENDERING"?5:0):5;
 $("frame").innerHTML=`<div class="state"><div class="word RUNNING">${esc(w)}</div><div class="sub">${w==="RENDERING"&&of?`shot ${Math.min(step+1,of)} / ${of}`:""}${p&&p.attempt>1?` · try ${p.attempt}`:""}${p&&p.calls?` · ${p.calls} AI calls`:""}</div><div class="line"><i style="width:${share}%"></i></div></div>`}
function done(job,lines){if(job.run){show(job.run);return}const p=job.progress||{};const st=job.status||p.word||"?";
 $("frame").innerHTML=job.clip?`<video id="vb" src="${file(job.clip)}" loop playsinline preload="auto" controls muted></video>`:`<div class="state"><div class="word ${esc(st)}">${esc(st)}</div><div class="sub">${esc((job.gap||"").slice(0,160))}</div></div>`;
 $("under").innerHTML=`<span class="st ${esc(st)}">${esc(st)}</span><span>${usd(p.spent)}</span><span>${p.calls||0} AI calls</span>`;
 if(job.kind==="make")picks(lines,p.picks)}
async function go(kind){const lines=$("lines").value.split("\n").map(s=>s.trim()).filter(Boolean);
 const body={home,lines,style:false,sound:false,design:$("design").value};
 try{const {job}=await j("/api/"+kind,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  await follow(job,kind,lines)}catch(e){fail(e)}}
function fail(e){$("frame").innerHTML=`<div class="state"><div class="word ERROR">ERROR</div><div class="sub">${esc(e.message)}</div></div>`;busy=false;check()}
async function follow(job,kind,lines){busy=true;check();editing();$("under").innerHTML="";
 $("mname").textContent=`${lines.length} ${lines.length==1?"line":"lines"} · ${kind==="make"?"make":"replay"}`;working(null);
 try{for(;;){const s=await j("/api/job?id="+job);
   if(s.state==="done"){done(s,lines);break}working(s.progress);if(kind==="make")picks(lines,s.progress&&s.progress.picks);
   await new Promise(r=>setTimeout(r,1500))}
 }catch(e){fail(e);return}
 busy=false;load()}
async function resume(){const c=await j("/api/current");if(!c.job)return false;
 if(c.home!==home){home=c.home;$("home").value=home}$("lines").value=(c.lines||[]).join("\n");
 shown="(running)";await load();follow(c.job,c.kind,c.lines||[]);return true}
$("home").onchange=e=>{home=e.target.value;shown="";gen++;blank();load()};
$("make").onclick=()=>go("make");$("replay").onclick=()=>go("design");
$("lines").oninput=()=>{if(!fits(designs.find(x=>x.name===$("design").value),count()))fit();check()};$("design").onchange=check;
$("edit").onclick=editing;$("playboth").onclick=()=>{["va","vb"].forEach(id=>{const v=$(id);if(v){v.currentTime=0;v.play()}})};
$("skillsbtn").onclick=()=>$("skills").classList.toggle("open");homes().then(resume);
</script></html>
